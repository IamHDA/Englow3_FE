mutation StartChatImageUpload(
  $conversationId: ID!
  $contentType: String!
  $contentLength: Int!
) {
  startChatImageUpload(
    conversationId: $conversationId
    contentType: $contentType
    contentLength: $contentLength
  ) {
    uploadId
    uploadUrl
    contentType
    expiresInSeconds
  }
}
