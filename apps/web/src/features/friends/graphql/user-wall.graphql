# `posts` is the owner's posts, a page at a time; null when the wall is unavailable
# or the posts could not be read.
query UserWall($userId: ID!, $postsPage: Int, $postsSize: Int) {
  userWall(userId: $userId) {
    userId
    available
    friendCount
    relationship {
      ...RelationshipFields
    }
    profile {
      userId
      displayName
      avatarUrl
      bannerUrl
      staff
      joinedAt
    }
    posts(page: $postsPage, size: $postsSize) {
      ...BlogPostPageFields
    }
  }
}
