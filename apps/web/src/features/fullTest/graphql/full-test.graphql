fragment FullTestSittingFields on FullTestSitting {
  id
  fullTestId
  title
  status
  startedAt
  deadlineAt
  gradesDueAt
  completedAt
  examId
  examAttemptId
  parts {
    slot
    taskId
    attemptId
    grading
  }
  listeningBand
  readingBand
  writingBand
  speakingBand
  provisionalBand
  overallBand
  bandRevision
  revisedAt
}

query FullTestLibrary($page: Int = 0) {
  fullTests {
    id
    title
    description
    certificateVariant
  }
  myFullTestSittings(page: $page, size: 20) {
    ...FullTestSittingFields
  }
}

mutation StartFullTestAssessment(
  $sittingId: ID!
  $slot: FullTestSlot!
  $taskId: ID!
  $contentType: String
  $contentLength: Int
) {
  startFullTestAssessment(
    sittingId: $sittingId
    slot: $slot
    taskId: $taskId
    contentType: $contentType
    contentLength: $contentLength
  ) {
    attemptId
    uploadUrl
  }
}

query FullTestSitting($id: ID!) {
  fullTestSitting(id: $id) {
    ...FullTestSittingFields
  }
}

mutation StartFullTest($fullTestId: ID!) {
  startFullTest(fullTestId: $fullTestId) {
    ...FullTestSittingFields
  }
}

# The full test an IELTS learner's onboarding sends them to: newest first.
query PlacementFullTests {
  fullTests {
    id
    certificateVariant
  }
}
