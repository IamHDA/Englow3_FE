fragment BlogModerationTargetFields on BlogModerationTarget {
  targetType
  targetId
  targetStatus
  author {
    ...BlogAuthorFields
  }
  content {
    title
    body
    postId
    createdAt
    images {
      id
      url
    }
    tags {
      ...BlogTagFields
    }
  }
  reports {
    id
    reason
    detail
    status
    resolutionNote
    createdAt
    resolvedAt
    reporter {
      ...BlogAuthorFields
    }
  }
  actions {
    id
    action
    reason
    createdAt
    moderator {
      ...BlogAuthorFields
    }
  }
}

query AdminBlogTarget($type: BlogTargetType!, $id: ID!) {
  adminBlogTarget(type: $type, id: $id) {
    ...BlogModerationTargetFields
  }
}
