fragment ExamAttemptFields on ExamAttempt {
  id
  examId
  status
  startedAt
  expiresAt
  submittedAt
  scoredAt
  rawScore
  maxRawScore
  scorePercentage
  convertedScore
  correctAnswerCount
  questionCount
  resumed
  examTitle
  mode
  timeLimitSeconds
  parts {
    id
    sectionType
    title
  }
}
mutation StartFullTestPaper($sittingId: ID!, $onOpen: OpenAttemptChoice) {
  startFullTestPaper(sittingId: $sittingId, onOpen: $onOpen) {
    ...ExamAttemptFields
  }
}
query ActiveExamAttempt($examId: ID!, $mode: ExamAttemptMode!) {
  activeExamAttempt(examId: $examId, mode: $mode) {
    ...ExamAttemptFields
  }
}

query ExamDraft($attemptId: ID!) {
  examDraft(attemptId: $attemptId) {
    answers {
      questionId
      selectedOptionIds
      textAnswer
    }
    version
    savedAt
  }
}
mutation SaveExamDraft(
  $attemptId: ID!
  $version: Int!
  $answers: [SubmitAnswerInput!]!
) {
  saveExamDraft(attemptId: $attemptId, version: $version, answers: $answers) {
    answers {
      questionId
      selectedOptionIds
      textAnswer
    }
    version
    savedAt
  }
}

fragment AttemptReviewFields on AttemptQuestionReview {
  questionId
  selectedOptionIds
  correctOptionIds
  correct
  awardedRawScore
  explanation
  options {
    optionId
    correct
    explanation
  }
  textAnswer
  acceptedAnswers
  numberFrom
  numberTo
}

fragment AttemptSectionScoreFields on AttemptSectionScore {
  sectionType
  rawScore
  maxRawScore
  band
  correctAnswerCount
  questionCount
}

mutation StartExamAttempt($examId: ID!, $input: StartExamAttemptInput) {
  startExamAttempt(examId: $examId, input: $input) {
    ...ExamAttemptFields
  }
}

query AttemptPaper($attemptId: ID!) {
  attemptPaper(attemptId: $attemptId) {
    id
    title
    description
    examType
    certificateType
    certificateVariant
    targetLevel
    durationSeconds
    maxRawScore
    passScore
    versionNumber
    sections {
      id
      sectionType
      orderNo
      maxRawScore
      scoredByCriteria
      timeLimitSeconds
      parts {
        id
        orderNo
        title
        instruction
        content
        audioUrl
        imageUrl
        questionSets {
          id
          title
          instruction
          orderNo
          content
          audioUrl
          imageUrl
          questions {
            id
            questionType
            content
            difficultyLevel
            skillType
            questionCategory
            orderNo
            maxRawScore
            numberFrom
            numberTo
            choiceLimit
            options {
              id
              content
              orderNo
            }
          }
          setOptions {
            id
            label
            content
            orderNo
          }
        }
      }
    }
  }
}

mutation SubmitExamAttempt($attemptId: ID!, $answers: [SubmitAnswerInput!]!) {
  submitExamAttempt(attemptId: $attemptId, answers: $answers) {
    ...ExamAttemptFields
    questions {
      ...AttemptReviewFields
    }
    sections {
      ...AttemptSectionScoreFields
    }
  }
}

query ExamAttemptResult($id: ID!) {
  examAttempt(id: $id) {
    ...ExamAttemptFields
    questions {
      ...AttemptReviewFields
    }
    sections {
      ...AttemptSectionScoreFields
    }
  }
}

query ExamAttemptHistory($page: Int, $size: Int) {
  examAttempts(page: $page, size: $size) {
    items {
      ...ExamAttemptFields
    }
    page
    size
    totalItems
    totalPages
  }
}

# The browser is still on a full sitting. Resolves to whether it is still open;
# a sitting nobody has reported on for a couple of minutes is ended by the backend.
mutation HeartbeatExamAttempt($attemptId: ID!) {
  heartbeatExamAttempt(attemptId: $attemptId)
}
