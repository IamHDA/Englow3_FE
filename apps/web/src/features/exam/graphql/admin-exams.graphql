fragment AdminExamFields on ExamListItem {
  id
  title
  examType
  certificateType
  certificateVariant
  targetLevel
  status
  versionNumber
  createdByUserId
  publishedAt
  createdAt
  submittedForReviewAt
  reviewNote
}

query AdminExams(
  $status: ExamStatus
  $examType: ExamType
  $title: String
  $page: Int
  $size: Int
) {
  adminExams(
    status: $status
    examType: $examType
    title: $title
    page: $page
    size: $size
  ) {
    items {
      ...AdminExamFields
    }
    page
    size
    totalItems
    totalPages
  }
}

fragment AdminExamShellFields on Exam {
  id
  title
  status
  versionNumber
  publishedAt
  submittedForReviewAt
  reviewedAt
  reviewNote
}

mutation PublishExam($id: ID!) {
  publishExam(id: $id) {
    ...AdminExamShellFields
  }
}

mutation ArchiveExam($id: ID!) {
  archiveExam(id: $id) {
    ...AdminExamShellFields
  }
}

mutation SubmitExamForReview($id: ID!) {
  submitExamForReview(id: $id) {
    ...AdminExamShellFields
  }
}

mutation ApproveExam($id: ID!) {
  approveExam(id: $id) {
    ...AdminExamShellFields
  }
}

mutation RejectExam($id: ID!, $note: String!) {
  rejectExam(id: $id, note: $note) {
    ...AdminExamShellFields
  }
}
