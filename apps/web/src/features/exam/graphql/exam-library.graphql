query ExamLibrary(
  $examType: ExamType
  $certificateType: CertificateType
  $certificateVariant: CertificateVariant
  $targetLevel: TargetLevel
  $title: String
  $page: Int
  $size: Int
) {
  exams(
    examType: $examType
    certificateType: $certificateType
    certificateVariant: $certificateVariant
    targetLevel: $targetLevel
    title: $title
    page: $page
    size: $size
  ) {
    items {
      id
      title
      description
      examType
      certificateType
      certificateVariant
      targetLevel
      durationSeconds
      maxRawScore
      passScore
      questionCount
      status
      publishedAt
      bestScore
      attemptStatus
    }
    page
    size
    totalItems
    totalPages
  }
}

query ExamDetail($id: ID!) {
  exam(id: $id) {
    id
    title
    description
    examType
    certificateType
    certificateVariant
    targetLevel
    durationSeconds
    maxRawScore
    passScore
    questionCount
    status
    publishedAt
    bestScore
    attemptStatus
  }
}

query ExamPaper($id: ID!) {
  examPaper(id: $id) {
    id
    title
    description
    examType
    certificateType
    certificateVariant
    targetLevel
    durationSeconds
    maxRawScore
    passScore
    status
    versionNumber
    sections {
      id
      sectionType
      orderNo
      maxRawScore
      scoredByCriteria
      timeLimitSeconds
      parts {
        id
        orderNo
        title
        instruction
        content
        audioObjectKey
        imageObjectKey
        questionSets {
          id
          title
          instruction
          orderNo
          content
          audioObjectKey
          imageObjectKey
          questions {
            id
            questionType
            content
            difficultyLevel
            skillType
            questionCategory
            orderNo
            maxRawScore
            explanation
            options {
              id
              content
              orderNo
              correct
              explanation
            }
          }
        }
      }
    }
  }
}
