name: CI

# Validate only — no secrets, no environments, so this also runs on PRs from
# forks. Deploying is a separate concern: see `deploy.yml`.
#
# There is no `push` trigger on purpose. Direct pushes to main/dev are blocked
# by branch protection, so every commit reaching them arrives through a PR that
# already ran this workflow; a push trigger would only duplicate that run.
#
# Note: the paths-ignore list here and the two in `deploy.yml` must stay in sync
# by hand. GitHub Actions does not support YAML anchors.
on:
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - "**/*.md"
      - ".idea/**"
      - ".claude/**"
      - ".gitignore"

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  # A validation run superseded by a newer commit is worthless.
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      # A broken mobile typecheck should not hide the state of web and bff.
      fail-fast: false
      matrix:
        app: [web, bff, mobile]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm --filter ${{ matrix.app }} --if-present run lint

      - name: Typecheck
        run: pnpm --filter ${{ matrix.app }} exec tsc --noEmit

      - name: Test
        run: pnpm --filter ${{ matrix.app }} --if-present run test

      # `--if-present` turns a missing script into a silent pass, so a green
      # check can mean "clean" or "never ran". Spell out which.
      - name: Summarise gate
        if: always()
        env:
          APP: ${{ matrix.app }}
        run: |
          set -euo pipefail
          {
            echo "### Quality gate: \`$APP\`"
            echo "- \`typecheck\` — ran"
            node -e '
              const fs = require("fs");
              const pkg = JSON.parse(fs.readFileSync(`apps/${process.env.APP}/package.json`, "utf8"));
              for (const s of ["lint", "test"]) {
                console.log(pkg.scripts?.[s]
                  ? `- \`${s}\` — ran`
                  : `- \`${s}\` — :warning: no script defined, **skipped**`);
              }
            '
          } >> "$GITHUB_STEP_SUMMARY"
