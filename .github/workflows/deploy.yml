name: Deploy

# Deploy only. Lint/typecheck/test live in `ci.yml` and this workflow does not
# wait on them: the merge gate is branch protection, not the deploy step.
#
# `ci.yml` deliberately has no paths-ignore — a skipped workflow reports no
# check, which would hang a required check. The list below is this workflow's
# own, only.
#
# No `pull_request` trigger: every run here is a `push` (or manual dispatch),
# so a PR only ever runs `ci.yml` — no more random-domain previews that can't
# reach each other. There are three fixed, independent environments, one per
# branch: `main` (production), `dev` and `testing` (preview, each aliased to
# its own fixed hostname below). `testing` has no branch protection — push or
# merge straight into it to get a stable domain to test against, without
# touching `dev`.
on:
  push:
    branches: [main, dev, testing]
    paths-ignore:
      - "**/*.md"
      - ".idea/**"
      - ".claude/**"
      - ".gitignore"
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        options: [preview, production]
        default: preview

concurrency:
  # One group per branch. Superseded production deploys are a race, so this
  # never cancels an in-flight run (default `cancel-in-progress: false`).
  group: deploy-${{ github.ref_name }}

permissions:
  contents: read

env:
  # Vercel team slug, needed by `vercel alias set`.
  VERCEL_SCOPE: englow3
  # Pushes to `dev`/`testing` are preview deploys, so they land on a random
  # URL. These aliases give each staging environment a fixed hostname. `main`
  # needs none: --prod claims the production domain by itself.
  DEV_ALIAS_WEB: englow3-web-dev.vercel.app
  DEV_ALIAS_BFF: englow3-bff-dev.vercel.app
  TEST_ALIAS_WEB: englow3-web-test.vercel.app
  TEST_ALIAS_BFF: englow3-bff-test.vercel.app

jobs:
  # Secrets are not readable from a job-level `if:`, and a step-level `env:` is
  # not readable from that same step's `if:` either. So presence checks happen
  # here, once, and the rest of the workflow gates on these outputs.
  setup:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
      has_web: ${{ steps.resolve.outputs.has_web }}
      has_bff: ${{ steps.resolve.outputs.has_bff }}
    steps:
      - name: Resolve target and available projects
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          DISPATCH_TARGET: ${{ inputs.target }}
          WEB_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_WEB || secrets.VERCEL_PROJECT_ID }}
          BFF_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_BFF }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            target="$DISPATCH_TARGET"
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_NAME" = "main" ]; then
            target="production"
          else
            target="preview"
          fi

          # Emit only whether an id exists, never the id itself.
          has_web=false; [ -n "$WEB_PROJECT_ID" ] && has_web=true
          has_bff=false; [ -n "$BFF_PROJECT_ID" ] && has_bff=true

          {
            echo "target=$target"
            echo "has_web=$has_web"
            echo "has_bff=$has_bff"
          } >> "$GITHUB_OUTPUT"

          echo "### Target: \`$target\` (web: $has_web, bff: $has_bff)" >> "$GITHUB_STEP_SUMMARY"

  # Web and BFF deploy in separate jobs on separate runners. They used to share
  # one working directory, where the second `vercel pull` overwrote the first
  # project's .vercel/project.json while .vercel/output still held the first
  # build — one failed build away from deploying web's output as the BFF.
  deploy-web:
    needs: [setup]
    if: needs.setup.outputs.has_web == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.setup.outputs.target }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      # `vercel build` runs locally and so cannot reach Vercel's remote cache.
      - name: Restore Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/web/.next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-${{ hashFiles('pnpm-lock.yaml') }}-
            next-

      - id: deploy
        uses: ./.github/actions/vercel-deploy
        with:
          project-id: ${{ secrets.VERCEL_PROJECT_ID_WEB || secrets.VERCEL_PROJECT_ID }}
          org-id: ${{ secrets.VERCEL_ORG_ID }}
          token: ${{ secrets.VERCEL_TOKEN }}
          target: ${{ needs.setup.outputs.target }}
          scope: ${{ env.VERCEL_SCOPE }}
          alias: >-
            ${{ (github.event_name == 'push' && github.ref_name == 'dev' && env.DEV_ALIAS_WEB) ||
                (github.event_name == 'push' && github.ref_name == 'testing' && env.TEST_ALIAS_WEB) ||
                '' }}

      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ALIAS_URL: ${{ steps.deploy.outputs.alias-url }}
          TARGET: ${{ needs.setup.outputs.target }}
        run: |
          echo "### Web ($TARGET): $URL" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ALIAS_URL" ]; then
            echo "Aliased to: $ALIAS_URL" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-bff:
    needs: [setup]
    if: needs.setup.outputs.has_bff == 'true'
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.setup.outputs.target }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup

      - id: deploy
        uses: ./.github/actions/vercel-deploy
        with:
          project-id: ${{ secrets.VERCEL_PROJECT_ID_BFF }}
          org-id: ${{ secrets.VERCEL_ORG_ID }}
          token: ${{ secrets.VERCEL_TOKEN }}
          target: ${{ needs.setup.outputs.target }}
          scope: ${{ env.VERCEL_SCOPE }}
          alias: >-
            ${{ (github.event_name == 'push' && github.ref_name == 'dev' && env.DEV_ALIAS_BFF) ||
                (github.event_name == 'push' && github.ref_name == 'testing' && env.TEST_ALIAS_BFF) ||
                '' }}

      - name: Summary
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ALIAS_URL: ${{ steps.deploy.outputs.alias-url }}
          TARGET: ${{ needs.setup.outputs.target }}
        run: |
          echo "### BFF ($TARGET): $URL" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$ALIAS_URL" ]; then
            echo "Aliased to: $ALIAS_URL/graphql" >> "$GITHUB_STEP_SUMMARY"
          fi
