name: Deploy web

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

concurrency:
  group: web-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # --- Quality gate: Web ---
      - name: Lint (web)
        run: pnpm --filter web --if-present run lint

      - name: Typecheck (web)
        run: pnpm --filter web exec tsc --noEmit

      - name: Test (web)
        run: pnpm --filter web --if-present run test

      # --- Quality gate: BFF ---
      - name: Lint (bff)
        run: pnpm --filter bff --if-present run lint

      - name: Typecheck (bff)
        run: pnpm --filter bff exec tsc --noEmit

      - name: Test (bff)
        run: pnpm --filter bff --if-present run test

      # --- Quality gate: Mobile ---
      - name: Lint (mobile)
        run: pnpm --filter mobile --if-present run lint

      - name: Typecheck (mobile)
        run: pnpm --filter mobile exec tsc --noEmit

      - name: Test (mobile)
        run: pnpm --filter mobile --if-present run test

      # --- Xác định target ---
      - name: Resolve target
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref_name }}" = "main" ]; then
            echo "TARGET_ENV=production" >> "$GITHUB_ENV"
            echo "PROD_FLAG=--prod"       >> "$GITHUB_ENV"
          else
            echo "TARGET_ENV=preview"     >> "$GITHUB_ENV"
            echo "PROD_FLAG="             >> "$GITHUB_ENV"
          fi

      - name: Vercel Pull, Build & Deploy Web
        id: deploy
        run: |
          CLI="pnpm dlx vercel@latest"
          export VERCEL_PROJECT_ID="${{ secrets.VERCEL_PROJECT_ID_WEB || secrets.VERCEL_PROJECT_ID }}"
          $CLI pull --yes --environment=$TARGET_ENV --token=${{ secrets.VERCEL_TOKEN }}
          $CLI build $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }}
          URL=$($CLI deploy --prebuilt $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "### Web Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Vercel Pull, Build & Deploy BFF
        if: env.VERCEL_PROJECT_ID_BFF != ''
        env:
          VERCEL_PROJECT_ID_BFF: ${{ secrets.VERCEL_PROJECT_ID_BFF }}
        id: deploy_bff
        run: |
          CLI="pnpm dlx vercel@latest"
          export VERCEL_PROJECT_ID="${{ secrets.VERCEL_PROJECT_ID_BFF }}"
          $CLI pull --yes --environment=$TARGET_ENV --token=${{ secrets.VERCEL_TOKEN }}
          $CLI build $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }}
          URL=$($CLI deploy --prebuilt $PROD_FLAG --token=${{ secrets.VERCEL_TOKEN }})
          echo "url_bff=$URL" >> "$GITHUB_OUTPUT"
          echo "### BFF Deployed: $URL" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.url }}
          BFF_URL: ${{ steps.deploy_bff.outputs.url_bff }}
        with:
          script: |
            const webUrl = process.env.PREVIEW_URL;
            const bffUrl = process.env.BFF_URL;
            const marker = '<!-- vercel-preview -->';
            let body = `${marker}\n**Web Preview:** ${webUrl}`;
            if (bffUrl) {
              body += `\n**BFF GraphQL Preview:** ${bffUrl}/graphql`;
            }
            body += `\n\nCommit: \`${context.sha.slice(0,7)}\``;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

